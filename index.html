<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmojiExpress | Herramienta de Copiado Profesional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>EmojiExpress</h1>
        <p>Selecciona los emojis para armar tu mensaje y cópialos de una vez</p>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar emoji (ej: fuego, ventas, flecha)...">
        </div>
    </header>
    
        <section class="workstation">
    <div class="composer-wrapper">
        <div class="input-group">
            <input type="text" id="emojiComposer" placeholder="Tus emojis aparecerán aquí...">
            <span id="charCounter" class="char-counter">0</span>
        </div>
        <div class="composer-actions">
            <button id="btnCopyAll" class="btn-primary">Copiar Combo</button>
            <button id="btnClear" class="btn-secondary">Limpiar</button>
        </div>
    </div>
</section>
    </section>

<nav class="categories">
    <button onclick="filterCategory('todos')" class="active">Sugeridos</button>
    <button onclick="filterCategory('ventas')">Ventas</button>
    <button onclick="filterCategory('caras')">Emociones</button>
    <button onclick="filterCategory('objetos')">Herramientas</button>
    <button onclick="toggleLibrary()" id="btnLibrary" style="background: var(--primary); color: white;">📂 Ver Todos</button>
</nav>
    <div id="fullLibrary" class="hidden">
    <div class="library-groups">
        <button onclick="renderByGroup('animales')">🐾 Animales</button>
        <button onclick="renderByGroup('comida')">🍔 Comida</button>
        <button onclick="renderByGroup('viajes')">✈️ Viajes</button>
        <button onclick="renderByGroup('banderas')">🏁 Banderas</button>
        <button onclick="renderByGroup('simbolos')">🔣 Símbolos</button>
    </div>
</div>

    <main id="emojiGrid" class="emoji-grid">
        </main>

    <div id="toast" class="toast hidden">Copiado al portapapeles</div>

    <script src="script.js"></script>
</body>
</html>
