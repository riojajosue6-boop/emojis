<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="monetag" content="dd8b148ee7a346aa92f65a607a73a5d2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmojiExpress | Editor de Marketing Profesional</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1>EmojiExpress</h1>
            <p>Editor de Publicaciones Profesional</p>
        </header>
 
        <main class="main-card">
            <div class="card-header">
                <span>Crear publicación</span>
            </div>

            <div class="editor-section">
                    <textarea id="emojiComposer" placeholder="Escribe tu publicación aquí..." spellcheck="false"></textarea>
    
                    <div class="editor-footer">
                        <span id="charCounter">0 caracteres</span>
                    </div>
            </div>

            <div class="toolbar">
                <div class="format-buttons">
                    <button id="btnBold" title="Negrita"><b>B</b></button>
                    <button id="btnItalic" title="Cursiva"><i>I</i></button>
                    <select id="fontSelector">
                        <option value="normal">Fuente Estándar</option>
                        <option value="bold">Negrita Pro</option>
                        <option value="italic">Cursiva Elegante</option>
                        <option value="monospace">Monoespaciado</option>
                        <option value="script">Manuscrita</option>
                    </select>
                </div>
                <div class="action-buttons">
                    <button id="btnCopyAll" class="btn-blue">Copiar Post</button>
                    <button id="btnClear" class="btn-gray">Limpiar</button>
                </div>
            </div>
        </main>

        <section class="emoji-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar emoji (ej: ventas, flecha)...">
            </div>

            <nav class="category-nav">
                <button onclick="filterCategory('fuego', event)" class="active">🔥 Sugeridos</button>
                <button onclick="filterCategory('ventas', event)">💰 Ventas</button>
                <button onclick="filterCategory('caras', event)">😊 Emociones</button>
                <button onclick="filterCategory('personas', event)">🙅‍♂️ Personas</button>
                <button onclick="filterCategory('profesiones', event)">👩‍🎓 Profesiones</button>
                <button onclick="filterCategory('herramientas', event)">🛠️ Herramientas</button>
                <button onclick="filterCategory('animales', event)">🐾 Animales</button>
                <button onclick="filterCategory('comida', event)">🍔 Comida</button>
                <button onclick="filterCategory('viajes', event)">✈️ Viajes</button>
                <button onclick="filterCategory('banderas', event)">🏁 Banderas</button>
                <button onclick="filterCategory('simbolos', event)">🔣 Símbolos</button>
            </nav>
            
            <div id="emojiGrid" class="emoji-grid-compact"></div>
        </section>

        <div id="toast" class="toast hidden">¡Copiado con éxito!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
